backend:
  name: git-gateway  # Netlify's bridge to GitHub
  branch: main       # Change to 'master' if that's your default

media_folder: "assets/img"     # REQUIRED: Local path for uploaded media (e.g., images)
public_folder: "/assets/img"   # URL path for media in the built site (starts with /)
#media_library:                 # REQUIRED: Config for media uploads
#  name: image-gallery          # Default handler; supports drag-and-drop
#  config:
#    multiple: false            # Allow single uploads (set true for galleries)

collections:                   # REQUIRED: Your content types (non-empty array)
  - name: "blog"
    label: "Blog Posts"        # UI label
    folder: "_posts"           # Jekyll's posts directory
    create: true               # Allow creating new posts
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"  # Filename format: YYYY-MM-DD-title.md
    fields:                    # Fields for each post's front matter + body
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Excerpt", name: "excerpt", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }  # Main content
      - { label: "Categories", name: "categories", widget: "list", default: ["blog"] }
      # Add more, e.g., for featured image: - { label: "Featured Image", name: "image", widget: "image" }
      - {label: "Featured Image", name: "image", widget: "image"}