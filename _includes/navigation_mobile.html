<ol>
{% for item in site.navigation_links %}
  {%- if item.url contains '://' -%}
    <li class="nav-menu-item"><a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.title }}</a></li>
  {%- else -%}
    <li class="nav-menu-item{% if page.url == item.url %} active{% endif %}"><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
  {%- endif -%}
{% endfor %}
</ol>
