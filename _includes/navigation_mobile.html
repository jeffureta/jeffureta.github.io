<ol>
{% for item in site.navigation_links %}
  {%- if item.url contains '://' -%}
    <li{%- if page.url == item.url %} class="active"{% endif %}><a class="nav-menu-item" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.title }}</a></li>
  {%- else -%}
    <li{%- if page.url == item.url %} class="active"{% endif %}><a class="nav-menu-item" href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
  {%- endif -%}
{% endfor %}
</ol>
